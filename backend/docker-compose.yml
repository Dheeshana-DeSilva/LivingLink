      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/livinglink_visit_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=1234
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
